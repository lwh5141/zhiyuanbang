<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>志愿帮 · 首页线框图 + 交互原型</title>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #EAF3F9;
    color: #16324A;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    padding: 44px 52px 90px;
  }
  .tap { cursor: pointer; transition: transform .16s ease, box-shadow .16s ease, filter .16s ease; user-select: none; -webkit-user-select: none; }
  .tap:hover { filter: brightness(0.97); }
  .tap:active { transform: scale(.965); }
  .screen-in { animation: screenIn .3s cubic-bezier(.22,.8,.36,1) both; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .toast-in { animation: toastIn .24s ease both; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .wf-label { font-size: 12.5px; line-height: 1.55; color: #5B7A94; }
  ::selection { background: rgba(45,156,219,.22); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ============================================================
   志愿帮 · 首页线框图 + 交互原型
   PRD 依据：prd-gaokao-volunteer-engine-2026-09-23（V1.0 MVP）
   视觉方向：青空薄荷（天空蓝 #2D9CDB + 生机青绿 #27C493）
   设计假设（Junior notes）：
   - 首页 = 情绪锚点（倒计时/青空）+ 行动入口（开始填报）+ 信任前置（证据条）
   - P0 用户是家长代填者 → 大字号、明确按钮、少术语
   - 演示数据均为示意，非真实统计（PRD 合规要求：仅供参考）
   ============================================================ */

const { useState } = React;
const C = {
  sky: '#2D9CDB', skyDeep: '#1B6FA8', skyInk: '#0E4C77',
  mint: '#27C493', mintDeep: '#159B70',
  bg: '#F4FAFD', card: '#FFFFFF',
  ink: '#16324A', sub: '#5B7A94', line: '#DCEBF5',
  rush: '#FF9F43', stable: '#2D9CDB', safe: '#27C493', base: '#7C9CBF',
};

/* ---------- ios_frame.jsx 内联（iPhone 15 Pro 外壳） ---------- */
const iosFrameStyles = {
  wrapper: { display: 'inline-block', padding: 12, background: '#000', borderRadius: 60,
    boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)', position: 'relative' },
  screen: { position: 'relative', borderRadius: 48, overflow: 'hidden', background: '#fff' },
  statusBar: { position: 'absolute', top: 0, left: 0, right: 0, height: 54, display: 'flex',
    alignItems: 'center', justifyContent: 'space-between', padding: '0 32px 0 32px',
    fontSize: 16, fontWeight: 600, fontFamily: '-apple-system, "SF Pro Text", sans-serif',
    zIndex: 20, pointerEvents: 'none' },
  dynamicIsland: { position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)',
    width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 30 },
  statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
  signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
  signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
  batteryIcon: { width: 26, height: 12, border: '1.5px solid currentColor', borderRadius: 3,
    padding: 1, position: 'relative', opacity: 0.8 },
  batteryCap: { position: 'absolute', top: 3, right: -3, width: 2, height: 6,
    background: 'currentColor', borderRadius: '0 1px 1px 0' },
  content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'auto' },
  homeIndicator: { position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)',
    width: 140, height: 5, background: 'rgba(0,0,0,0.3)', borderRadius: 999, zIndex: 10 },
};

function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 100, darkMode = false }) {
  const textColor = darkMode ? '#fff' : '#000';
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width, height, background: darkMode ? '#000' : '#fff' }}>
        <div style={{ ...iosFrameStyles.statusBar, color: textColor }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1, opacity: 0.9 }} />
              <div style={iosFrameStyles.batteryCap} />
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div style={iosFrameStyles.content}>{children}</div>
        <div style={iosFrameStyles.homeIndicator} />
      </div>
    </div>
  );
}

/* ---------- 极简几何图标（功能性，非装饰堆砌） ---------- */
function IcHome({ color, size = 22 }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
    <path d="M4 11.2 12 4.5l8 6.7V19a1.4 1.4 0 0 1-1.4 1.4h-4v-5h-5.2v5h-4A1.4 1.4 0 0 1 4 19v-7.8z"
      stroke={color} strokeWidth="1.8" strokeLinejoin="round" fill={color === C.sky ? 'rgba(45,156,219,.16)' : 'none'} />
  </svg>;
}
function IcPlan({ color, size = 22 }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
    <rect x="5" y="3.5" width="14" height="17" rx="2.4" stroke={color} strokeWidth="1.8" fill={color === C.sky ? 'rgba(45,156,219,.16)' : 'none'} />
    <path d="M8.5 9h7M8.5 12.5h7M8.5 16h4.5" stroke={color} strokeWidth="1.8" strokeLinecap="round" />
  </svg>;
}
function IcMe({ color, size = 22 }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="8.2" r="3.7" stroke={color} strokeWidth="1.8" fill={color === C.sky ? 'rgba(45,156,219,.16)' : 'none'} />
    <path d="M4.8 20c1.1-3.4 3.9-5.1 7.2-5.1s6.1 1.7 7.2 5.1" stroke={color} strokeWidth="1.8" strokeLinecap="round" />
  </svg>;
}
function IcChevron({ color = '#9FB6C9', size = 18 }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
    <path d="m9 5.5 6.5 6.5L9 18.5" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
  </svg>;
}
function IcBack({ color = C.ink, size = 20 }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
    <path d="M15 5.5 8.5 12 15 18.5" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
  </svg>;
}

/* ---------- 首页（Home） ---------- */
function HomeScreen({ onEnterWizard, onContinueDraft, evOpen, onToggleEvidence }) {
  return (
    <div style={{ minHeight: '100%', background: C.bg, paddingBottom: 96 }}>
      {/* ① Hero：青空 + 倒计时 + 品牌 + 主 CTA */}
      <div style={{
        background: 'linear-gradient(178deg, #2D9CDB 0%, #56B7E8 42%, #A8DFF5 76%, #EAF7FD 100%)',
        padding: '26px 24px 30px', position: 'relative', overflow: 'hidden',
      }}>
        {/* 极简云 + 纸飞机：向未来出发的意象 */}
        <div style={{ position: 'absolute', top: 30, right: -26, width: 120, height: 44,
          background: 'rgba(255,255,255,.34)', borderRadius: 999, filter: 'blur(1px)' }} />
        <div style={{ position: 'absolute', top: 78, right: 66, width: 74, height: 26,
          background: 'rgba(255,255,255,.26)', borderRadius: 999, filter: 'blur(1px)' }} />
        <svg width="46" height="46" viewBox="0 0 46 46" fill="none"
          style={{ position: 'absolute', top: 16, right: 118, opacity: .92 }}>
          <path d="M4 22 40 7l-9 32-8.5-11.5L4 22z" fill="#fff" opacity=".95" />
          <path d="M22.5 27.5 40 7" stroke="#DDEFFB" strokeWidth="1.6" />
        </svg>

        <div style={{ color: 'rgba(255,255,255,.92)', fontSize: 13, letterSpacing: '0.06em', fontWeight: 500 }}>
          距 2027 年高考还有
        </div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 2,
          fontVariantNumeric: 'tabular-nums' }}>
          <span style={{ color: '#fff', fontSize: 66, fontWeight: 800, lineHeight: 1.15,
            textShadow: '0 2px 14px rgba(14,76,119,.18)' }}>256</span>
          <span style={{ color: 'rgba(255,255,255,.95)', fontSize: 17, fontWeight: 600 }}>天</span>
        </div>
        <div style={{ marginTop: 10 }}>
          <div style={{ color: '#fff', fontSize: 28, fontWeight: 800, letterSpacing: '0.04em' }}>志愿帮</div>
          <div style={{ color: 'rgba(255,255,255,.94)', fontSize: 14.5, marginTop: 5, fontWeight: 500 }}>
            你只管确认，翻译交给我们
          </div>
        </div>
        <div className="tap" onClick={onEnterWizard} style={{
          marginTop: 20, background: '#fff', borderRadius: 16, padding: '15px 18px',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          boxShadow: '0 8px 24px rgba(14,76,119,.18)',
        }}>
          <div>
            <div style={{ fontSize: 17.5, fontWeight: 700, color: C.skyInk }}>开始填报</div>
            <div style={{ fontSize: 12.5, color: C.sub, marginTop: 3 }}>5 步 · 净输入 ≤8 项 · 全程可回改</div>
          </div>
          <div style={{ width: 38, height: 38, borderRadius: 12, background: C.sky, display: 'flex',
            alignItems: 'center', justifyContent: 'center' }}>
            <IcChevron color="#fff" size={20} />
          </div>
        </div>
      </div>

      {/* ② 断点续填卡（US5 / REQ-003） */}
      <div style={{ padding: '16px 20px 0' }}>
        <div className="tap" onClick={onContinueDraft} style={{
          background: 'rgba(39,196,147,.10)', border: '1px solid rgba(39,196,147,.35)',
          borderRadius: 14, padding: '13px 15px', display: 'flex', alignItems: 'center', gap: 12,
        }}>
          <div style={{ width: 36, height: 36, borderRadius: 11, background: C.mint, flexShrink: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
              <path d="M7 5.5v13M7 5.5 16.5 12 7 18.5v-13z" fill="#fff" />
            </svg>
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14.5, fontWeight: 700, color: C.mintDeep }}>继续上次填报</div>
            <div style={{ fontSize: 12.5, color: C.sub, marginTop: 2 }}>第 2 步 · 分数确认 · 草稿已自动保存</div>
          </div>
          <IcChevron />
        </div>
      </div>

      {/* ③ 证据条（REQ-009：G2 立身之本，可验证信任前置到首页） */}
      <div style={{ padding: '14px 20px 0' }}>
        <div style={{ fontSize: 15.5, fontWeight: 800, color: C.ink }}>
          每一条推荐，都有据可查
        </div>
        <div style={{ fontSize: 12.5, color: C.sub, marginTop: 3 }}>
          位次一律系统反查，概率给出区间，不黑箱
        </div>
        <div className="tap" onClick={onToggleEvidence} style={{
          marginTop: 10, background: C.card, borderRadius: 14, border: `1px solid ${C.line}`,
          padding: '13px 15px', boxShadow: '0 2px 10px rgba(22,50,74,.05)',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
            <span style={{ background: 'rgba(45,156,219,.14)', color: C.skyDeep, fontSize: 12,
              fontWeight: 700, padding: '3px 8px', borderRadius: 7, flexShrink: 0 }}>稳</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: C.ink,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                华南师范大学 · 计算机科学与技术
              </div>
              <div style={{ fontSize: 11, color: C.sub, marginTop: 2 }}>专业组 205 · 示意</div>
            </div>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.stable,
              fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>52–68%</div>
            <div style={{ transform: evOpen ? 'rotate(90deg)' : 'none', transition: 'transform .2s' }}>
              <IcChevron size={15} />
            </div>
          </div>
          {evOpen && (
            <div className="screen-in" style={{ marginTop: 11, borderTop: `1px dashed ${C.line}`, paddingTop: 11 }}>
              {[
                ['往年位次', '23,800 – 26,500（2023–2025）'],
                ['同分段人数', '412 人'],
                ['计划数', '86 人 · 较去年 +8%'],
                ['概率因子', '位次正态 μ25,100/σ1,900 ∩ 历史频率 61%'],
              ].map(([k, v]) => (
                <div key={k} style={{ display: 'flex', gap: 10, padding: '4px 0', alignItems: 'baseline' }}>
                  <span style={{ width: 5, height: 5, borderRadius: 2, background: C.sky, flexShrink: 0,
                    position: 'relative', top: -2 }} />
                  <span style={{ fontSize: 12, color: C.sub, width: 74, flexShrink: 0 }}>{k}</span>
                  <span style={{ fontSize: 12.5, color: C.ink, fontWeight: 600,
                    fontVariantNumeric: 'tabular-nums' }}>{v}</span>
                </div>
              ))}
              <div style={{ marginTop: 8, background: C.bg, borderRadius: 9, padding: '7px 10px',
                fontSize: 11.5, color: C.sub, lineHeight: 1.5 }}>
                引用：2025 年广东省一分一段表 · 598 分对应位次 24,156（演示数据）
              </div>
            </div>
          )}
        </div>
      </div>

      {/* ④ 冲稳保垫四梯度预览（2:3:3:2） */}
      <div style={{ padding: '14px 20px 0' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
          <div style={{ fontSize: 15.5, fontWeight: 800, color: C.ink }}>方案长这样</div>
          <div style={{ fontSize: 11.5, color: C.sub }}>45 个平行志愿 · 2:3:3:2</div>
        </div>
        <div style={{ display: 'flex', gap: 4, marginTop: 10 }}>
          {[['冲', C.rush, '20%'], ['稳', C.stable, '30%'], ['保', C.safe, '30%'], ['垫', C.base, '20%']].map(([t, c, w]) => (
            <div key={t} style={{ width: w, background: c, height: 12, borderRadius: 6,
              display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <span style={{ fontSize: 10.5, color: '#fff', fontWeight: 700 }}>{t}</span>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
          {[['冲 <40%', C.rush], ['稳 40–75%', C.stable], ['保 75–95%', C.safe], ['垫 >95%', C.base]].map(([t, c]) => (
            <div key={t} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
              <span style={{ width: 7, height: 7, borderRadius: 2, background: c }} />
              <span style={{ fontSize: 11, color: C.sub, fontVariantNumeric: 'tabular-nums' }}>{t}</span>
            </div>
          ))}
        </div>
      </div>

      {/* 首发省份说明 */}
      <div style={{ padding: '16px 20px 0' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 7, fontSize: 12, color: C.sub }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
            <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z" stroke={C.sub} strokeWidth="1.8" />
            <circle cx="12" cy="10" r="2.4" stroke={C.sub} strokeWidth="1.8" />
          </svg>
          首发省份 广东 · 3+1+2 院校专业组模式
        </div>
      </div>
    </div>
  );
}

/* ---------- 采集向导（S1 定位 / S2 分数） ---------- */
function WizardScreen({ step, onNext, onBackHome, setWStep, showToast }) {
  const [score, setScore] = useState('598');
  const [province, setProvince] = useState('广东');
  const [track, setTrack] = useState('物理');
  const [electives, setElectives] = useState(['化学', '生物']);
  const [showSub, setShowSub] = useState(false);
  const [subs, setSubs] = useState({ 语文: '118', 数学: '132', 英语: '141' });
  /* 示意映射表（演示数据）：[分数, 位次, 超过考生百分比]，线性插值 */
  const rankTable = [[540,140000,18],[550,115000,24],[560,92000,30],[570,72000,37],[575,63000,41],[580,55000,45],[585,47000,49],[590,39600,54],[595,29500,58],[598,24156,62],[600,21300,64],[605,16000,68],[610,13000,72],[620,8000,80],[630,4800,87],[640,2800,93],[650,990,98],[660,400,99]];
  const n = parseInt(score || '0', 10) || 0;
  let rank = 0, pct = 0;
  if (n >= 660) { rank = 400; pct = 99; }
  else if (n >= 540) {
    for (let i = 0; i < rankTable.length - 1; i++) {
      const [s1, r1, p1] = rankTable[i], [s2, r2, p2] = rankTable[i + 1];
      if (n >= s1 && n <= s2) { const t = (n - s1) / (s2 - s1); rank = Math.round(r1 + (r2 - r1) * t); pct = Math.round(p1 + (p2 - p1) * t); break; }
    }
  } else if (n > 0) { rank = 168000; pct = 13; }
  const subSum = (parseInt(subs['语文'] || '0', 10) || 0) + (parseInt(subs['数学'] || '0', 10) || 0) + (parseInt(subs['英语'] || '0', 10) || 0);
  const elecOk = electives.length === 2;
  const toggleElec = (s) => {
    if (electives.includes(s)) { setElectives(electives.filter(x => x !== s)); showToast('再选科目已更新 · 草稿已自动保存'); }
    else if (electives.length >= 2) { showToast('再选科目最多 2 科（广东 3+1+2 规则）'); }
    else { setElectives([...electives, s]); showToast('再选科目已更新 · 草稿已自动保存'); }
  };
  const backWithDraft = () => { showToast('草稿已保存，可随时继续'); onBackHome(); };
  return (
    <div style={{ minHeight: '100%', background: C.bg, paddingBottom: 40 }}>
      {/* 顶栏 */}
      <div style={{ background: '#fff', padding: '10px 16px 12px', borderBottom: `1px solid ${C.line}` }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div className="tap" onClick={backWithDraft} aria-label="返回" style={{ display: 'flex', alignItems: 'center', gap: 2, padding: 4 }}>
            <IcBack />
          </div>
          <div style={{ fontSize: 14.5, fontWeight: 700, color: C.ink }}>
            采集向导 · 第 {step} 步 / 共 5 步
          </div>
          <div style={{ width: 28 }} />
        </div>
        <div style={{ marginTop: 10, height: 5, background: C.line, borderRadius: 3, overflow: 'hidden' }}>
          <div style={{ width: `${(step / 5) * 100}%`, height: '100%', background: `linear-gradient(90deg, ${C.sky}, ${C.mint})`,
            borderRadius: 3, transition: 'width .35s ease' }} />
        </div>
        <div className="tap" onClick={() => showToast('每一步都可返回修改，草稿已自动保存')}
          style={{ marginTop: 8, fontSize: 11.5, color: C.sub, textAlign: 'center' }}>
          全程可回改 · 草稿自动保存（点此了解）
        </div>
      </div>

      {step === 1 && (
        <div className="screen-in" style={{ padding: '16px 20px' }}>
          {/* 回显确认条（默认来自「记住上次选择」兜底） */}
          <div style={{ background: 'rgba(45,156,219,.08)', borderRadius: 10, padding: '8px 12px',
            fontSize: 12.5, color: C.skyDeep, fontWeight: 600 }}>
            已选择：{province} · {track}类{electives.length ? ' · 再选 ' + electives.join('+') : ''}（可随时返回修改）
          </div>
          <div style={{ fontSize: 19, fontWeight: 800, color: C.ink, marginTop: 16 }}>你在哪个省份？</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 9, marginTop: 12 }}>
            {[
              ['广东', true], ['河北', false], ['河南', false], ['四川', false],
            ].map(([p, on]) => (
              <div key={p} className="tap" onClick={() => { if (on) { setProvince(p); showToast('已选择' + p + ' · 草稿已自动保存'); } else { showToast('该省份暂未开放，上线后提醒你'); } }}
                style={{ background: p === province ? 'rgba(45,156,219,.10)' : '#fff', border: `1.5px solid ${p === province ? C.sky : C.line}`,
                  borderRadius: 13, padding: '13px 14px', position: 'relative' }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: p === province ? C.skyDeep : C.ink }}>{p}</div>

/* ---------- AppPhone：单机可点击状态机 ---------- */
function AppPhone() {
  const [screen, setScreen] = useState('home');
  const [wStep, setWStep] = useState(1);
  const [evOpen, setEvOpen] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = (msg) => {
    setToast(msg);
    window.clearTimeout(window.__toastTimer);
    window.__toastTimer = window.setTimeout(() => setToast(null), 1900);
  };
  const enterWizard = (step) => { setWStep(step); setScreen('wizard'); };

  return (
    <div id="phone-root" style={{ position: 'relative', width: 393, height: '100%', background: C.bg, overflow: 'hidden' }}>
      <div key={screen + '-' + wStep} style={{ position: 'absolute', inset: 0, overflow: 'auto' }}>
        {screen === 'home' && (
          <HomeScreen evOpen={evOpen}
            onEnterWizard={() => enterWizard(1)}
            onContinueDraft={() => enterWizard(2)}
            onToggleEvidence={() => setEvOpen(v => !v)} />
        )}
        {screen === 'wizard' && (
          <WizardScreen step={wStep} setWStep={setWStep} showToast={showToast}
            onBackHome={() => setScreen('home')}
            onNext={() => wStep < 2 ? setWStep(wStep + 1) : setScreen('plan')} />
        )}
        {screen === 'plan' && <PlanScreen onBackHome={() => setScreen('home')} showToast={showToast} />}
        {screen === 'me' && <MeScreen />}
      </div>
      {(screen === 'home' || screen === 'plan' || screen === 'me') && (
        <TabBar tab={screen} onTab={(k) => setScreen(k)} />
      )}
      {toast && (
        <div className="toast-in" style={{ position: 'absolute', bottom: 104, left: '50%',
          transform: 'translateX(-50%)', background: 'rgba(22,50,74,.88)', color: '#fff',
          fontSize: 12.5, padding: '9px 16px', borderRadius: 999, whiteSpace: 'nowrap', zIndex: 50,
          boxShadow: '0 6px 18px rgba(0,0,0,.2)' }}>
          {toast}
        </div>
      )}
    </div>
  );
}
